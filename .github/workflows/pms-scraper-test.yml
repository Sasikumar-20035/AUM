name: PMS Scraper Test (One-Time)

on:
  workflow_dispatch:   # run manually

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write OAuth credentials (credentials.json + token.json)
        env:
          CREDS: ${{ secrets.GSPREAD_CREDENTIALS_JSON }}
          TOKEN: ${{ secrets.GSPREAD_TOKEN_JSON }}
        run: |
          echo "$CREDS" > credentials.json
          echo "$TOKEN" > token.json

      - name: Run scraper for OCT 2025 (Capitalmind only)
        run: |
          echo "Running test for: 10-2025"
          python Data1.py "Capitalmind Financial Services Private Limited" "10-2025"
          echo "Test completed."

